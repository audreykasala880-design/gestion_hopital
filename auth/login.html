<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Espace Professionnel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f764a'/><path d='M44 20h12v60H44zM20 44h60v12H20z' fill='white'/></svg>">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <!-- Header de la carte -->
        <div class="auth-header">
            <div class="auth-logo">
                <svg viewBox="0 0 40 40" width="36" height="36" fill="none">
                    <path d="M17 8h6v24H17z" fill="#fff"/>
                    <path d="M8 17h24v6H8z" fill="#fff"/>
                </svg>
            </div>
            <div class="auth-title">Espace Professionnel</div>
            <div class="auth-subtitle">Centre Médical Hope · Kinshasa</div>
        </div>

        <!-- Corps de la carte -->
        <div class="auth-body">

            <!-- Erreurs -->
            
            <!-- Formulaire -->
            <form id="loginForm" method="get" action="#" data-demo-form="true" onsubmit="return false;">
                <input type="hidden" name="csrf_token" value="demo-only">

                <div class="form-group">
                    <label class="form-label" for="login_email">
                        Adresse Email professionnelle
                    </label>
                    <input
                        type="email"
                        id="login_email"
                        name="email"
                        class="form-control"
                        placeholder="exemple@hopecmedical.cd"
                        value=""
                        autocomplete="email"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="login_password">
                        Mot de passe
                    </label>
                    <input
                        type="password"
                        id="login_password"
                        name="mot_de_passe"
                        class="form-control"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 8px;">
                    Se connecter à l'espace pro
                </button>
            </form>

            <p style="text-align:center; font-size:0.8rem; color:var(--text-muted); margin: 16px 0 0;">
                <a href="../index.html" style="color: var(--text-secondary);">← Retour à l'accueil public</a>
            </p>

            <!-- Comptes de démonstration -->
            <div class="auth-demo-box">
                <div class="auth-demo-title">💡 Connexion désactivée en mode statique</div>

                <button type="button" class="auth-demo-btn" onclick="fillLogin('demo-admin@hope.invalid','demo-only')">
                    <div class="auth-demo-icon">👑</div>
                    <div class="auth-demo-info">
                        <strong>Démo administrative</strong>
                        <span>Aucun compte ni mot de passe n’est vérifié.</span>
                    </div>
                </button>

                <button type="button" class="auth-demo-btn" onclick="fillLogin('demo-reception@hope.invalid','demo-only')">
                    <div class="auth-demo-icon" style="background: var(--grad-teal);">🏥</div>
                    <div class="auth-demo-info">
                        <strong>Démo accueil</strong>
                        <span>Cette page ne connecte aucun utilisateur.</span>
                    </div>
                </button>
            </div>

        </div><!-- /.auth-body -->
    </div><!-- /.auth-card -->
</div><!-- /.auth-page -->

<script>
function fillLogin(email, pass) {
    document.getElementById('login_email').value = email;
    document.getElementById('login_password').value = pass;
    document.getElementById('login_email').dispatchEvent(new Event('input'));
    document.getElementById('loginForm').querySelector('[type="submit"]').focus();
}
</script>
<script src="../assets/js/script.js"></script>
</body>
</html>
